# Dependabot（GitHub 內建、免費）—— 由 ci-standards 導入腳本依偵測到的技術產生
#
# 每個 Dependabot PR 都會跑一整套 CI + Security，頻率要看著用：
#   - 套件（pip / npm / nuget）：每週，小版本併成一個 PR，major 單獨開
#   - docker / github-actions：每月一次
# cooldown：剛發布的版本先觀察 7 天再更新，避免搶到被動過手腳的新版。
# 緊急的安全更新走 Dependabot security updates（Settings → Code security 打開），不受排程限制。
# develop 流程：PR 一律發到 develop（正式分支只收 develop、hotfix/* 的 PR）。
version: 2

updates:

  - package-ecosystem: "npm"
    cooldown:
      default-days: 7
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    cooldown:
      default-days: 7
    directory: "/server"
    target-branch: "develop"
    schedule:
      interval: "monthly"

  - package-ecosystem: "github-actions"
    cooldown:
      default-days: 7
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    groups:
      actions-all:
        patterns: ["*"]
