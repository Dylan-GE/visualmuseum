<svg width="680" height="540" viewBox="0 0 680 540" xmlns="http://www.w3.org/2000/svg" role="img">
<title>虛擬礦業博物館系統架構圖</title>
<desc>前端瀏覽器應用（資料層、3D 場景層、HUD 互動層）透過 /api 代理連接後端 AI 導覽服務。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="60" y="90" width="560" height="290" rx="20" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="84" y="116" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">前端：瀏覽器 (Vite dev server)</text>
<text x="84" y="134" font-family="sans-serif" font-size="12" fill="#185FA5">React + React Three Fiber</text>

<rect x="90" y="155" width="500" height="60" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="340" y="176" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#633806">資料層</text>
<text x="340" y="198" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#854F0B">museum_data.json（fetch 載入）</text>

<line x1="213" y1="215" x2="213" y2="240" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="468" y1="215" x2="468" y2="240" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="100" y="240" width="225" height="110" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="213" y="268" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">3D 場景層</text>
<text x="213" y="290" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">SceneCanvas.jsx 為核心</text>
<text x="213" y="312" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">隧道、路徑、熱點、展品</text>

<rect x="355" y="240" width="225" height="110" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="468" y="268" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">HUD / 互動層</text>
<text x="468" y="290" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#993C1D">小地圖・收藏・AI 導覽</text>
<text x="468" y="312" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#993C1D">位置提示・控制說明・彈窗</text>

<line x1="468" y1="350" x2="468" y2="410" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="478" y="385" text-anchor="start" font-family="sans-serif" font-size="12" fill="#5f5e5a">/api 代理</text>

<rect x="60" y="410" width="560" height="100" rx="20" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="84" y="436" font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489">後端：AI 導覽服務</text>
<text x="84" y="458" font-family="sans-serif" font-size="12" fill="#534AB7">server/index.js（Express，port 8787）</text>
<text x="84" y="480" font-family="sans-serif" font-size="12" fill="#534AB7">呼叫 Anthropic API 產生導覽回覆</text>
</svg>
